simulation:
  timestep: 0.005
  model_path: "models/combined.xml"
  max_duration: 150.0        # two chained pick-and-place runs -- generous budget

go2:
  kp_hip:   60.0
  kp_thigh: 80.0
  kp_knee:  100.0
  kd:       4.0
  gait_period:   0.6
  swing_height:  0.05
  stride_length: 0.10

panda:
  home_pose: [0.0, 0.0, 0.0, -1.5708, 0.0, 1.5708, -0.7853]
  ik_iterations: 15
  ik_step_size:  0.15
  ik_damping:    0.01
  ik_tolerance:  0.003

task:
  # NEW: task.sequence chains multiple Tasks via next_task()/set_next_task().
  # The model has exactly one physical cube, so this is a relay: task A picks
  # it up and places it at its target_pos; task B's cube_pos is seeded with
  # that same point (where the cube will actually be), then places it
  # somewhere new. Each item supports the same keys as the flat task: block
  # above (type/cube_pos/target_pos/etc) -- only type/cube_pos/target_pos are
  # set here for brevity, the rest fall back to PickAndPlaceTask's defaults.
  sequence:
    - type: pick_and_place
      cube_pos:   [1.6, 0.0,  0.325]
      target_pos: [1.6, 0.20, 0.331]
    - type: pick_and_place
      cube_pos:   [1.6, 0.20, 0.331]   # where task A leaves the cube
      target_pos: [1.6, -0.20, 0.331]
  stop_distance:     0.65
  stable_duration:   2.0
  stabilize_duration: 2.0
  height_settle_time: 2.0
  approach_threshold: 0.05
  descend_threshold:  0.025
  grasp_hold_duration: 3.0
  release_duration:   0.8
  min_approach_time:  5.5
  min_descend_time:   2.0
  min_lift_time:      4.0
  min_transport_time: 0.8
  min_lower_time:     4.0

panda_mass_scale: 0.35

viewer:
  camera_azimuth: -140.0
  camera_elevation: -20.0
  camera_distance: 3.5
  status_interval: 0.5
